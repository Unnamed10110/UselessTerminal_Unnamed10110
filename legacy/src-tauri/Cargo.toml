[package]
name = "useless-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "UselessTerminal"

[[bin]]
name = "UselessTerminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64.workspace = true
chrono.workspace = true
ut-fs = { path = "../crates/ut-fs" }
ut-pty = { path = "../crates/ut-pty" }
ut-vt-scan = { path = "../crates/ut-vt-scan" }
ut-core = { path = "../crates/ut-core" }
ut-data = { path = "../crates/ut-data" }
ut-shell = { path = "../crates/ut-shell" }
ut-ssh = { path = "../crates/ut-ssh" }
png = "0.17"
url = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_System_Ole", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common", "Win32_UI_Controls",
  "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem",
  "Win32_Graphics_DirectWrite", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse",
] }
