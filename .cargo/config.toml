# Link the C runtime statically, so UselessTerminal.exe runs on a clean Windows install without the Visual C++
# Redistributable (it would otherwise import vcruntime140.dll / vcruntime140_1.dll). No runtime cost.
# NB: a RUSTFLAGS environment variable replaces this setting (cargo does not merge them).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
