[workspace]
resolver = "2"
members = [
  "crates/ut-fs",
  "crates/ut-pty",
  "crates/ut-vt-scan",
  "crates/ut-core",
  "crates/ut-data",
  "crates/ut-shell",
  "crates/ut-ssh",
  "crates/ut-term",
  "crates/ut-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tracing = "0.1"
vte = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows = "0.62"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
alacritty_terminal = "0.26"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
